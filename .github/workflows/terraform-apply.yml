name: Terraform Apply (dev)

# master へマージ（infra または analysis-worker 変更を含む push）されたら apply する。
# 誤適用を防ぐため GitHub Environment "dev" の承認（必要なら）を通す。
# 手動実行（workflow_dispatch）も可能。

on:
  push:
    branches: [master]
    paths:
      - "apps/analysis-worker/**"
      - "infra/terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.14.9"
  WORKING_DIR: infra/terraform/envs/dev

jobs:
  apply:
    name: terraform apply (dev)
    runs-on: ubuntu-latest
    # Environment に承認者やシークレットを紐付け、適用前ゲートとして使う。
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: |
          terraform -chdir=${{ env.WORKING_DIR }} init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}"

      # 適用前に plan を生成してファイルに固定する。Environment "dev" の承認者は
      # このジョブのログで差分を確認してから approve すること（required reviewers を設定）。
      # apply は再計算せず、この plan ファイルをそのまま適用し、レビュー差分との乖離を防ぐ。
      - name: Terraform Plan
        run: |
          terraform -chdir=${{ env.WORKING_DIR }} plan -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir=${{ env.WORKING_DIR }} apply -input=false tfplan
