name: Terraform Plan (dev)

# PR で infra または analysis-worker の変更が入ったら、fmt/validate/plan を実行して結果を PR にコメントする。
# 認証は Workload Identity 連携（WIF）。長期のサービスアカウントキーは使わない。

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/analysis-worker/**"
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

# WIF（OIDC）に必要な権限。id-token: write が必須。
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.14.9"
  WORKING_DIR: infra/terraform/envs/dev

jobs:
  plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    # fork からの PR では WIF クレデンシャル（id-token）を露出させない。
    # 同一リポジトリ内のブランチ PR のみ plan を実行する。
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        id: fmt
        run: terraform -chdir=${{ env.WORKING_DIR }} fmt -recursive -check

      # GCP へ WIF で認証（鍵レス）。下記 secrets はリポジトリ/環境に設定する。
      #   GCP_WORKLOAD_IDENTITY_PROVIDER: projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
      #   GCP_DEPLOY_SERVICE_ACCOUNT:     terraform 実行用 SA のメール
      #   GCP_PROJECT_ID:                 対象プロジェクト ID
      #   TFSTATE_BUCKET:                 state 保存先 GCS バケット名
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: |
          terraform -chdir=${{ env.WORKING_DIR }} init \
            -backend-config="bucket=${{ secrets.TFSTATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform -chdir=${{ env.WORKING_DIR }} validate

      - name: Terraform Plan
        id: plan
        run: |
          terraform -chdir=${{ env.WORKING_DIR }} plan -no-color -input=false \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -out=tfplan
        continue-on-error: true

      - name: Comment plan result on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fmt = '${{ steps.fmt.outcome }}';
            const plan = '${{ steps.plan.outcome }}';
            const body = [
              '### Terraform Plan (dev)',
              '',
              `- fmt: \`${fmt}\``,
              `- plan: \`${plan}\``,
              '',
              plan === 'failure'
                ? ':x: plan が失敗しました。Actions のログを確認してください。'
                : ':white_check_mark: plan が完了しました。差分はログを確認してください。',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
